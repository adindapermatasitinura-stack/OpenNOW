name: apply-xuanling

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply XuanLing patch
        run: python3 scripts/apply_xuanling.py

      - name: Install build dependencies for cargo check
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libssl-dev

      # Informational: shows compile errors in the log but does not block the commit.
      - name: cargo check
        continue-on-error: true
        working-directory: native/opennow-core
        run: cargo check

      - name: Commit and push
        run: |
          git config user.name "xuanling-patch"
          git config user.email "xuanling-patch@users.noreply.github.com"
          git add native/opennow-core/src
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add XuanLing login provider"
            git push
          fi